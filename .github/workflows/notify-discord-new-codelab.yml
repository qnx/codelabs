
name: Notify Discord about new codelabs

on:
  push:
    branches:
      - main
    paths:
      - docs/codelabs-list.js

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Detect new codelabs
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_SHA: ${{ github.sha }}
          PREVIOUS_SHA: ${{ github.event.before }}
        run: |
          node <<'NODE'
          const fs = require('fs');

          const api = `https://api.github.com/repos/${process.env.REPOSITORY}`;
          const headers = {
            Authorization: `Bearer ${process.env.GH_TOKEN}`,
            Accept: 'application/vnd.github+json'
          };

          async function getJson(url) {
            const response = await fetch(url, { headers });
            if (!response.ok) {
              throw new Error(`GitHub API ${response.status}: ${await response.text()}`);
            }
            return response.json();
          }

          async function getCodelabs(sha) {
            const file = await getJson(
              `${api}/contents/docs/codelabs-list.js?ref=${sha}`
            );

            const source = Buffer.from(file.content, 'base64').toString('utf8');
            const match = source.match(
              /window\.CODELABS\s*=\s*(\[[\s\S]*\])\s*;?\s*$/
            );

            if (!match) {
              throw new Error('Could not parse window.CODELABS array.');
            }

            return JSON.parse(match[1]);
          }

          async function main() {
            const previousSha = process.env.PREVIOUS_SHA;

            if (!previousSha || /^0+$/.test(previousSha)) {
              console.log('No previous commit to compare.');
              fs.appendFileSync(process.env.GITHUB_OUTPUT, 'added=[]\n');
              return;
            }

            const [oldLabs, newLabs] = await Promise.all([
              getCodelabs(previousSha),
              getCodelabs(process.env.CURRENT_SHA)
            ]);

            const oldIds = new Set(oldLabs.map(lab => lab.id));
            const added = newLabs.filter(lab => !oldIds.has(lab.id));

            fs.appendFileSync(
              process.env.GITHUB_OUTPUT,
              `added=${JSON.stringify(added)}\n`
            );

            console.log(`New codelabs found: ${added.length}`);
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Notify Discord
        if: steps.detect.outputs.added != '[]'
        env:
          DISCORD_CODELAB_WEBHOOK: ${{ secrets.DISCORD_CODELAB_WEBHOOK }}
          ADDED_CODELABS: ${{ steps.detect.outputs.added }}
        run: |
          node <<'NODE'
          async function main() {
            const labs = JSON.parse(process.env.ADDED_CODELABS);

            for (const lab of labs) {
              const href = String(lab.href).replace(/^\/+/, '');
              const url = `https://qnx.github.io/codelabs/${href}`;

              const content = [
                '📘 **New QNX Codelab Published**',
                `**${lab.title}**`,
                `**Author:** ${lab.authors || 'Not specified'}`,
                `**Summary:** ${lab.summary || 'No summary provided'}`,
                `**Read the codelab:** ${url}`
              ].join('\n');

              const response = await fetch(
                process.env.DISCORD_CODELAB_WEBHOOK,
                {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ content })
                }
              );

              if (!response.ok) {
                throw new Error(`Discord returned ${response.status}: ${await response.text()}`);
              }

              console.log(`Notification sent: ${lab.title}`);
            }
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
