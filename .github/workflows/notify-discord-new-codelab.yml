
name: Notify Discord about new codelabs

on:
  deployment_status:

permissions:
  contents: read

jobs:
  notify:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'github-pages'

    runs-on: ubuntu-latest

    steps:
      - name: Check for new codelabs and notify Discord
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          DEPLOY_SHA: ${{ github.event.deployment.sha }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          node <<'NODE'
          const API = `https://api.github.com/repos/${process.env.REPOSITORY}`;
          const HEADERS = {
            Authorization: `Bearer ${process.env.GH_TOKEN}`,
            Accept: 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2022-11-28'
          };

          async function github(url) {
            const response = await fetch(url, { headers: HEADERS });
            if (!response.ok) {
              throw new Error(`GitHub API ${response.status}: ${await response.text()}`);
            }
            return response.json();
          }

          async function getCodelabs(sha) {
            const file = await github(
              `${API}/contents/docs/codelabs-list.js?ref=${sha}`
            );

            const source = Buffer
              .from(file.content.replace(/\s/g, ''), 'base64')
              .toString('utf8');

            const match = source.match(
              /window\.CODELABS\s*=\s*(\[[\s\S]*\])\s*;?\s*$/
            );

            if (!match) {
              throw new Error('Could not find window.CODELABS array.');
            }

            return JSON.parse(match[1]);
          }

          async function main() {
            const sha = process.env.DEPLOY_SHA;

            // Find the commit immediately before the deployed commit.
            const commit = await github(`${API}/commits/${sha}`);
            const parentSha = commit.parents?.[0]?.sha;

            if (!parentSha) {
              console.log('No parent commit. Nothing to compare.');
              return;
            }

            // First check whether the codelab list file changed.
            const comparison = await github(
              `${API}/compare/${parentSha}...${sha}`
            );

            const listChanged = (comparison.files || []).some(
              file => file.filename === 'docs/codelabs-list.js'
            );

            if (!listChanged) {
              console.log('Codelab list unchanged. No notification needed.');
              return;
            }

            // Compare IDs in the old and new lists.
            const oldLabs = await getCodelabs(parentSha);
            const newLabs = await getCodelabs(sha);

            const oldIds = new Set(oldLabs.map(lab => lab.id));

            const addedLabs = newLabs.filter(
              lab => !oldIds.has(lab.id)
            );

            if (addedLabs.length === 0) {
              console.log('No new codelab IDs found. No notification needed.');
              return;
            }

            console.log(`Found ${addedLabs.length} new codelab(s).`);

            // Send one Discord message per newly added codelab.
            for (const lab of addedLabs) {
              const href = String(lab.href).replace(/^\/+/, '');
              const url = `https://qnx.github.io/codelabs/${href}`;

              const message = [
                '📘 **New QNX Codelab Published**',
                `**${lab.title}**`,
                `**Author:** ${lab.authors || 'Not specified'}`,
                `**Summary:** ${lab.summary || 'No summary provided'}`,
                `**Read the codelab:** ${url}`
              ].join('\n');

              const response = await fetch(
                process.env.DISCORD_WEBHOOK,
                {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ content: message })
                }
              );

              if (!response.ok) {
                throw new Error(
                  `Discord error ${response.status}: ${await response.text()}`
                );
              }

              console.log(`Notification sent: ${lab.title}`);
            }
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
