
name: Notify Discord about new codelabs

on:
  deployment_status:

permissions:
  contents: read

jobs:
  notify:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'github-pages'
    runs-on: ubuntu-latest

    steps:
      - name: Detect newly deployed codelabs
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          DEPLOY_SHA: ${{ github.event.deployment.sha }}
        run: |
          node <<'NODE'
          const fs = require('fs');

          const api = `https://api.github.com/repos/${process.env.REPOSITORY}`;
          const headers = {
            Authorization: `Bearer ${process.env.GH_TOKEN}`,
            Accept: 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2022-11-28'
          };

          async function getJson(url) {
            const response = await fetch(url, { headers });
            if (!response.ok) {
              throw new Error(`GitHub API error ${response.status}: ${await response.text()}`);
            }
            return response.json();
          }

          async function getCodelabs(sha) {
            const url = `${api}/contents/docs/codelabs-list.js?ref=${sha}`;
            const file = await getJson(url);
            const source = Buffer.from(file.content.replace(/\s/g, ''), 'base64').toString('utf8');

            const json = source
              .replace(/^\s*window\.CODELABS\s*=\s*/, '')
              .replace(/;\s*$/, '');

            return JSON.parse(json);
          }

          async function main() {
            const commit = await getJson(`${api}/commits/${process.env.DEPLOY_SHA}`);
            const previousSha = commit.parents?.[0]?.sha;

            const current = await getCodelabs(process.env.DEPLOY_SHA);
            const previous = previousSha ? await getCodelabs(previousSha) : [];

            const previousIds = new Set(previous.map(lab => lab.id));
            const added = current.filter(lab => !previousIds.has(lab.id));

            fs.appendFileSync(
              process.env.GITHUB_OUTPUT,
              `added=${JSON.stringify(added)}\n`
            );

            console.log(`Found ${added.length} newly added codelab(s).`);
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Send Discord notifications
        if: steps.detect.outputs.added != '[]'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          ADDED_CODELABS: ${{ steps.detect.outputs.added }}
        run: |
          node <<'NODE'
          async function main() {
            const codelabs = JSON.parse(process.env.ADDED_CODELABS);

            for (const lab of codelabs) {
              const url = `https://qnx.github.io/codelabs/${lab.href}`;

              const content = [
                '📘 **New QNX Codelab Published**',
                `**${lab.title}**`,
                `**Author:** ${lab.authors || 'Not specified'}`,
                `**Summary:** ${lab.summary || 'No summary provided'}`,
                `**Read the codelab:** ${url}`
              ].join('\n');

              const response = await fetch(process.env.DISCORD_WEBHOOK, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content })
              });

              if (!response.ok) {
                throw new Error(`Discord webhook error ${response.status}: ${await response.text()}`);
              }

              console.log(`Sent notification for: ${lab.title}`);
            }
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
